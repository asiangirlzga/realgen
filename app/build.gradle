plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.realgen.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.realgen.app"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version "3.11"
    }
}
